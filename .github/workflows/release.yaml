name: release

# A `server-v<version>` tag, which `make release` pushes, publishes that
# version as a GitHub release: one archive per platform and their checksums.
# It installs nothing; whoever runs a server takes the archive from there.
#
# The runner is a Mac because codesign signs the macOS binary; Go builds the
# Linux ones from it.
on:
  push:
    tags: ['server-v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  server:
    runs-on: macos-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/verify-release-preconditions
        with:
          github-token: ${{ github.token }}
      - name: Tag must state the version in the files
        run: scripts/cut-release.sh --check "$GITHUB_REF_NAME"
      - uses: ./.github/actions/import-signing-certificate
        with:
          certificate-p12: ${{ secrets.MACOS_CERT_P12 }}
          certificate-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - run: make -C server dist
        env:
          CODESIGN_IDENTITY: Developer ID Application
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          server/build/dist/*.tar.gz server/build/dist/SHA256SUMS
