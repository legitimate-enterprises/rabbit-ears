name: ci

# One chain per stack, each on its own: a stack's lint starts when that
# stack's style is green, whatever the other stacks are doing. stack.yaml is
# the chain; a red run names the stack and the gate in its title.
#
# A stack runs only when something its gates read differs from the last
# commit on main that passed, so a green run says every stack is green at
# this commit, the skipped ones by their last run.
#
# `branches` is spelled out: a bare `push:` also matches tags.
on:
  push:
    branches: ['**']

jobs:
  changed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      server: ${{ steps.changed.outputs.server }}
      web: ${{ steps.changed.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: make --no-print-directory changed | tee -a "$GITHUB_OUTPUT"

  server:
    needs: changed
    if: needs.changed.outputs.server == 'true'
    uses: ./.github/workflows/stack.yaml
    with:
      stack: server
      tests: '["test-unit", "test-integration"]'

  web:
    needs: changed
    if: needs.changed.outputs.web == 'true'
    uses: ./.github/workflows/stack.yaml
    with:
      stack: web
      tests: '["test-unit", "test-e2e"]'
