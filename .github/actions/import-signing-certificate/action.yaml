name: import signing certificate
description: >
  Imports a Developer ID Application certificate into a throwaway keychain and
  asserts the identity is usable before any build spends time on it. The
  keychain outlives the job, so this is for a runner that does not.
inputs:
  certificate-p12:
    description: Base64-encoded .p12 holding the Developer ID Application certificate.
    required: true
  certificate-password:
    description: Password for the .p12.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MACOS_CERT_P12: ${{ inputs.certificate-p12 }}
        MACOS_CERT_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        security delete-keychain build.keychain 2>/dev/null || true
        keychain_password="$(uuidgen)"
        security create-keychain -p "$keychain_password" build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security unlock-keychain -p "$keychain_password" build.keychain
        printf '%s' "$MACOS_CERT_P12" | base64 --decode > cert.p12
        security import cert.p12 -k build.keychain \
          -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        # codesign: is additive over the partitions this already granted, and
        # closes the case where a key ACL wants a confirmation nothing can give.
        security set-key-partition-list -S "apple-tool:,apple:,codesign:" \
          -s -k "$keychain_password" build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        rm -f cert.p12
        # A chain or key problem surfaces here in seconds, not as
        # errSecInternalComponent midway through the archive.
        security find-identity -v -p codesigning build.keychain
        security find-identity -v -p codesigning build.keychain |
          grep -q "Developer ID Application" ||
          { echo "::error::no valid Developer ID identity in build.keychain"; exit 1; }
